[pytest]
# 测试全部离线运行，用假接口顶替网络访问。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 运行期产物目录固定在工作区内已提交的 .test-artifacts：
# 本机的受限运行环境只对「命令启动时已存在」的目录授予写入权，
# 因此测试不要用 tmp_path 新建目录写文件，改用 conftest.py 里的 artifacts_dir。
# 关闭缓存插件，避免它另建 pytest-cache-files-* 目录被拒。
addopts = -p no:cacheprovider

filterwarnings =
    error::DeprecationWarning:xdao.*
    # 升级用例在后台线程里跑（界面本来就该这么做），线程退出后 Tkinter 的
    # Variable 可能在垃圾回收时才析构，此时主循环已经不在了，于是 __del__
    # 抛 RuntimeError 被 pytest 记成「未捕获异常」警告。对象正在被销毁，
    # 抛不抛都无所谓 —— 用例本身是过的，别让这条噪声盖住真问题。
    ignore::pytest.PytestUnraisableExceptionWarning
