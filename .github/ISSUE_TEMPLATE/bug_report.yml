name: 报一个问题
description: 程序崩了、导出不对劲、界面显示不对——用这张表单说清楚
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。这类工具的问题九成与**本机环境**和**具体那一次操作**有关，
        下面几栏填得越具体，越容易一次定位。

        填之前请先看一眼 [README](https://github.com/XiaoFeng7418/xdao-export#readme)
        与包里的 `使用说明.txt`，常见问题（登录、导出目录写不进去、PDF 渲染）那里都有说明。

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 窗口标题栏、`使用说明.txt` 首行，或命令行 `python main.py --version` 都能看到
      placeholder: 例如 0.22.0
    validations:
      required: true

  - type: dropdown
    id: how
    attributes:
      label: 怎么用的
      options:
        - 免安装包里的 xdao-export.exe（双击打开）
        - 从源码跑 python main.py
        - 只用命令行（python main.py <串号> ...）
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: 系统
      description: Windows 版本，以及显示缩放比例（设置 → 系统 → 显示 → 缩放）
      placeholder: 例如 Windows 11 23H2 / 缩放 150%
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际看到的现象，以及期望是什么
      placeholder: 点「开始导出」之后窗口不见了，导出目录里没有文件。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开程序开始，一步一步写；能稳定复现就写最容易的那条路径
      placeholder: |
        1. 打开程序，选「HTML」
        2. 粘一个串号，点「开始导出」
        3. 大约 10 秒后窗口消失
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 日志
      description: |
        程序目录下的 `xdao-export.log` 最有用（一路记着抓取与导出的每一步）。
        导出目录里如果有 `导出缺页清单-*.txt`，也一并贴上。
        **贴之前请把串号、饼干（userhash）、本机路径删掉或改成占位符。**
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnose
    attributes:
      label: 诊断脚本的输出（可选）
      description: |
        包里有 `诊断写入-双击运行.cmd`，双击跑完会留下一个结果文件；
        「导出目录写不进去」类的问题请把它贴上来。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 贴出来的内容里已删掉串号、饼干与本机路径
          required: true
        - label: 用的是最新版本（旧版本的问题可能已经修了）
          required: false
