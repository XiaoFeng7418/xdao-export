name: tests

# 每次推送与 PR 都跑一遍离线单元测试。
# 用例本身不联网（全部用测试替身），因此 runner 不需要任何凭据。
# 标签也要匹配：`version-consistency` 那个 job 只在 `refs/tags/v*` 上跑，
# 只写 branches 的话它永远等不到触发条件（v0.13.0 那次就是手动补跑的）。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：验证纯逻辑部分（不涉及 tkinter 界面）
          - os: ubuntu-latest
            python: "3.10"   # 项目声明的最低版本
          - os: ubuntu-latest
            python: "3.12"
          # Windows：真正的目标平台，验证 tkinter 相关导入与打包前置条件
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 确保没有任何网络代理干扰离线用例
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      # Linux 矩阵没有 $DISPLAY，界面用例按预期整组跳过。声明这一点，conftest 的跳过守卫
      # 才不会把「按预期跳过」当成不干净的运行（守卫默认要求界面用例必须真跑到）。
      XDAO_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: 语法检查（全部源码必须能编译）
        shell: bash
        run: |
          # 注意：compileall 即使遇到语法错误也返回 0，必须显式判错，
          # 否则这一步等于没检查。
          out=$(python -m compileall -q xdao main.py tools tests 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE 'error|Sorry'; then
            echo "::error::存在无法编译的文件"
            exit 1
          fi
          echo "全部文件编译通过"

      - name: 单元测试
        run: python -m pytest -q -rs

      - name: 命令行入口可用
        run: |
          python main.py --version
          python main.py --help

      - name: 导出器注册表完整
        run: |
          python -c "from xdao.exporters import EXPORTERS; expected={'html','pdf','txt','markdown','epub'}; got=set(EXPORTERS); assert got==expected, f'格式注册表不一致: {got}'; print('格式:', ', '.join(EXPORTERS))"

      # 这一步查的是**这台 runner 的环境**（有没有 Edge/Chrome、能不能写盘、
      # 能不能连上 GitHub 与站点），不是我们的代码：CI 机器上随时会因为缺浏览器
      # 或出网受限而红。所以只当参考，不阻断 —— 真正拦代码问题的是上面那步
      # 「单元测试」，它一点没放水。
      # 想让它确定性地跑，可以改成 `--selftest --offline --selftest-json`
      # （只验 JSON 结构，不判断各项成败），那样就能去掉 continue-on-error。
      - name: 源码版自检（仅联网可用时跑，失败不阻断）
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python main.py --selftest

  version-consistency:
    name: 版本号与最新 Release 一致
    runs-on: ubuntu-latest
    # 只在推送 tag 时检查：代码版本号必须与 tag 相同，避免发错版本
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 比对 tag 与 xdao.__version__
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from xdao import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              raise SystemExit(f"tag {tag} 与代码里的版本号 {__version__} 不一致")
          print(f"版本号一致：{__version__}")
          PY
