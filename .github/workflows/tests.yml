name: tests

# 每次推送与 PR 都跑一遍离线单元测试。
# 用例本身不联网（全部用测试替身），因此 runner 不需要任何凭据。
# 标签也要匹配：`version-consistency` 那个 job 只在 `refs/tags/v*` 上跑，
# 只写 branches 的话它永远等不到触发条件（v0.13.0 那次就是手动补跑的）。
# 动作版本：checkout@v7 / setup-python@v7（跑在 Node 24 上）。用回 v4/v5 的话，
# 每次跑都会多一条「Node.js 20 is deprecated」的警告注解（2026-10-02 修掉）。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 不设上限的话，卡住的用例会白白占满 6 小时的默认额度（历史上最长一次 12.8 分钟）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux：验证纯逻辑部分（不涉及 tkinter 界面）
          - os: ubuntu-latest
            python: "3.10"   # 项目声明的最低版本
          - os: ubuntu-latest
            python: "3.12"
          # Windows：真正的目标平台，验证 tkinter 相关导入与打包前置条件
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # 确保没有任何网络代理干扰离线用例
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      # Linux 矩阵没有 $DISPLAY，界面用例按预期整组跳过。声明这一点，conftest 的跳过守卫
      # 才不会把「按预期跳过」当成不干净的运行（守卫默认要求界面用例必须真跑到）。
      # Windows 必须实际建窗；Tk 初始化异常时由跳过守卫使任务失败。
      XDAO_HEADLESS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # 不写 cache: pip —— 仓库没有 requirements.txt / pyproject.toml，
          # setup-python 找不到依赖清单会直接报错（v0.22.1 的 CI 就是这么红的）。
          # 依赖只有 pytest 与 ruff 两个，装一次 4~12 秒，不值得为它维护清单。

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          # 钉住版本：pytest 大版本之间对 addopts / 插件行为的改动会直接改变用例结果
          python -m pip install pytest==9.2.0
          # 静态检查只用开发期，不进运行时依赖；版本钉住，免得规则集随上游漂移
          python -m pip install ruff==0.17.5

      - name: 语法检查（全部源码必须能编译）
        shell: bash
        run: |
          # 注意：compileall 即使遇到语法错误也返回 0，必须显式判错，
          # 否则这一步等于没检查。
          out=$(python -m compileall -q xdao main.py tools tests 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qiE 'error|Sorry'; then
            echo "::error::存在无法编译的文件"
            exit 1
          fi
          echo "全部文件编译通过"

      # 配置在仓库根目录的 ruff.toml：只挑「一定是错」的那几组规则（E4/E7/E9/F/B），
      # 不追求全规则零告警 —— 历史文件一大堆风格类问题，一次改不完也没必要改。
      # 2026-11-14 起这道门在 CI 上真的拦得住：当时把命中的 37 条全清了才让它绿。
      - name: 静态检查
        run: python -m ruff check .

      # 带上 --durations：ubuntu 上这步要 12 分钟、windows 只 7 分钟，
      # 看不出慢在哪就没法优化。末尾那 10 行不影响成败，只是把最慢的
      # 用例列出来。
      - name: 单元测试
        run: python -m pytest -q -rs --durations=10

      - name: 命令行入口可用
        run: |
          python main.py --version
          python main.py --help

      - name: 导出器注册表完整
        run: |
          python -c "from xdao.exporters import EXPORTERS; expected={'html','pdf','txt','markdown','epub'}; got=set(EXPORTERS); assert got==expected, f'格式注册表不一致: {got}'; print('格式:', ', '.join(EXPORTERS))"

      # 这一步验的是「自检这条命令本身」：跑得通、JSON 形状没变形、项数没少。
      # 不判断「runner 上有没有浏览器」「能不能连外网」这类环境项 —— 那些在 CI
      # 机器上随时会变，拿来当门禁只会时红时绿；而 selftest 崩了、少了一项、
      # JSON 结构改了，这里会红。原来那条 `--selftest` 带 continue-on-error，
      # 等于什么都没拦，所以换掉。
      - name: 源码版自检（离线，只验 JSON 结构）
        if: matrix.os == 'windows-latest'
        run: >-
          python -c "import json, subprocess, sys;
          out = subprocess.run([sys.executable, 'main.py', '--selftest', '--offline', '--selftest-json'], capture_output=True, text=True, encoding='utf-8');
          data = json.loads(out.stdout);
          keys = list(data);
          assert len(keys) == 2, keys;
          rows = data[keys[1]];
          assert len(rows) >= 5, len(rows);
          assert all(isinstance(row, dict) and len(row) >= 4 for row in rows), rows;
          print('selftest json ok:', len(rows), 'checks')"

  version-consistency:
    name: 版本号与最新 Release 一致
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只在推送 tag 时检查：代码版本号必须与 tag 相同，避免发错版本
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 比对 tag 与 xdao.__version__
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from xdao import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              raise SystemExit(f"tag {tag} 与代码里的版本号 {__version__} 不一致")
          print(f"版本号一致：{__version__}")
          PY
